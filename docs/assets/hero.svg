<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Aurora – one calm, fast client for everything you administer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff9f0a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff6fa8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fa8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb340" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb340"><animate attributeName="stop-color" values="#ffb340;#ff9f0a;#ff8a5c;#ffb340" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff6fa8"><animate attributeName="stop-color" values="#ff6fa8;#ffb340;#ff9f0a;#ff6fa8" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffe2a8"/>
      <stop offset="0.6" stop-color="#ff9f0a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- aurora ribbons (Phosphor: warm amber and pink) -->
    <g filter="url(#blur)">
      <path fill="url(#wave1)" d="M-100 190 C 150 60, 350 260, 600 150 S 1050 60, 1300 170 L1300 260 C1050 160, 850 300, 600 230 S 150 150, -100 280 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 -18; -40 10; 0 0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave2)" d="M-100 240 C 200 140, 400 320, 700 210 S 1100 130, 1300 230 L1300 310 C1050 230, 850 350, 600 290 S 200 220, -100 330 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -70 14; 50 -12; 0 0" dur="18s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- nova: a star that flares up, sends out rings and settles down again -->
    <g transform="translate(1030 84)">
      <circle r="120" fill="url(#halo)">
        <animate attributeName="r" values="70;150;70" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.35;1"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/>
      </circle>
      <g fill="none" stroke="#ffb340">
        <circle r="10" stroke-width="2" opacity="0">
          <animate attributeName="r" values="10;130" dur="6s" repeatCount="indefinite" begin="0s"/>
          <animate attributeName="opacity" values="0.8;0" dur="6s" repeatCount="indefinite" begin="0s"/>
        </circle>
        <circle r="10" stroke-width="1.5" opacity="0">
          <animate attributeName="r" values="10;130" dur="6s" repeatCount="indefinite" begin="1.2s"/>
          <animate attributeName="opacity" values="0.6;0" dur="6s" repeatCount="indefinite" begin="1.2s"/>
        </circle>
        <circle r="10" stroke-width="1" opacity="0">
          <animate attributeName="r" values="10;130" dur="6s" repeatCount="indefinite" begin="2.4s"/>
          <animate attributeName="opacity" values="0.45;0" dur="6s" repeatCount="indefinite" begin="2.4s"/>
        </circle>
      </g>
      <!-- diffraction cross -->
      <g stroke="#ffd48a" stroke-linecap="round" filter="url(#glow)">
        <line x1="-60" y1="0" x2="60" y2="0" stroke-width="2">
          <animate attributeName="x1" values="-14;-70;-14" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="14;70;14" dur="6s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="-60" x2="0" y2="60" stroke-width="2">
          <animate attributeName="y1" values="-14;-70;-14" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="14;70;14" dur="6s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle r="16" fill="url(#core)">
        <animate attributeName="r" values="9;24;9" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#fff"/>
    </g>

    <!-- small stars -->
    <g fill="#fff">
      <circle cx="90" cy="48" r="1.6"><animate attributeName="opacity" values=".15;.9;.15" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="30" r="1.2"><animate attributeName="opacity" values=".1;.8;.1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="58" r="1.4"><animate attributeName="opacity" values=".15;.9;.15" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="34" r="1.8"><animate attributeName="opacity" values=".1;.9;.1" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="150" r="1.1"><animate attributeName="opacity" values=".1;.7;.1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="240" r="1.3"><animate attributeName="opacity" values=".15;.8;.15" dur="4.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title -->
    <text x="600" y="150" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#title)">Aurora</text>
    <text x="600" y="196" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#d8d8de" opacity="0">One calm, fast client for everything you administer.
      <animate attributeName="opacity" values="0;1" begin="0.4s" dur="1.2s" fill="freeze"/>
    </text>

    <!-- protocol chips, gently floating -->
    <g font-family="'IBM Plex Mono', Consolas, Menlo, monospace" font-size="17" fill="#f5f5f7">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" repeatCount="indefinite"/>
        <rect x="118" y="238" width="78" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="157" y="262" text-anchor="middle">SSH</text>
        <rect x="206" y="238" width="86" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="249" y="262" text-anchor="middle">SFTP</text>
        <rect x="302" y="238" width="78" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="341" y="262" text-anchor="middle">RDP</text>
        <rect x="390" y="238" width="78" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="429" y="262" text-anchor="middle">VNC</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -4;0 3;0 -4" dur="6s" repeatCount="indefinite"/>
        <rect x="478" y="238" width="104" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="530" y="262" text-anchor="middle">Telnet</text>
        <rect x="592" y="238" width="96" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="640" y="262" text-anchor="middle">Serial</text>
        <rect x="698" y="238" width="86" height="36" rx="18" fill="#1c1c1e" stroke="#ff9f0a"/><text x="741" y="262" text-anchor="middle" fill="#ffb340">Web</text>
        <rect x="794" y="238" width="142" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="865" y="262" text-anchor="middle">Containers</text>
        <rect x="946" y="238" width="136" height="36" rx="18" fill="#1c1c1e" stroke="#3a3a3c"/><text x="1014" y="262" text-anchor="middle">Proxmox</text>
      </g>
    </g>

    <!-- terminal line with blinking cursor -->
    <g font-family="'IBM Plex Mono', Consolas, Menlo, monospace" font-size="19">
      <text x="420" y="324" fill="#32d74b">ops@aurora</text>
      <text x="540" y="324" fill="#a1a1a6">:~$</text>
      <text x="584" y="324" fill="#f5f5f7">ssh fw-kunde-a</text>
      <rect x="722" y="308" width="11" height="20" fill="#ff9f0a">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="22" fill="none" stroke="#2c2c2e"/>
</svg>
