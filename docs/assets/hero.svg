<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Aurora – one client for SSH, SFTP, RDP, VNC, Telnet, serial, web interfaces, containers and Proxmox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6cc9a5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9b7cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b7cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4f8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6cc9a5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb4ff"><animate attributeName="stop-color" values="#8fb4ff;#7de3bd;#b69cff;#8fb4ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7de3bd"><animate attributeName="stop-color" values="#7de3bd;#b69cff;#8fb4ff;#7de3bd" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- aurora ribbons -->
    <g filter="url(#blur)">
      <path fill="url(#wave1)" d="M-100 190 C 150 60, 350 260, 600 150 S 1050 60, 1300 170 L1300 260 C1050 160, 850 300, 600 230 S 150 150, -100 280 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 -18; -40 10; 0 0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave2)" d="M-100 240 C 200 140, 400 320, 700 210 S 1100 130, 1300 230 L1300 310 C1050 230, 850 350, 600 290 S 200 220, -100 330 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -70 14; 50 -12; 0 0" dur="18s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="90" cy="48" r="1.6" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="30" r="1.2" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="58" r="1.4" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="34" r="1.8" opacity=".6"><animate attributeName="opacity" values=".1;.9;.1" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="62" r="1.3" opacity=".5"><animate attributeName="opacity" values=".2;.8;.2" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="150" r="1.1" opacity=".4"><animate attributeName="opacity" values=".1;.7;.1" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title -->
    <text x="600" y="150" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#title)">Aurora</text>
    <text x="600" y="196" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#c9d3ee" opacity="0">One calm, fast client for everything you administer.
      <animate attributeName="opacity" values="0;1" begin="0.4s" dur="1.2s" fill="freeze"/>
    </text>

    <!-- protocol chips, gently floating -->
    <g font-family="'IBM Plex Mono', Consolas, Menlo, monospace" font-size="17" fill="#dfe7ff">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" repeatCount="indefinite"/>
        <rect x="118" y="238" width="78" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="157" y="262" text-anchor="middle">SSH</text>
        <rect x="206" y="238" width="86" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="249" y="262" text-anchor="middle">SFTP</text>
        <rect x="302" y="238" width="78" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="341" y="262" text-anchor="middle">RDP</text>
        <rect x="390" y="238" width="78" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="429" y="262" text-anchor="middle">VNC</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -4;0 3;0 -4" dur="6s" repeatCount="indefinite"/>
        <rect x="478" y="238" width="104" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="530" y="262" text-anchor="middle">Telnet</text>
        <rect x="592" y="238" width="96" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="640" y="262" text-anchor="middle">Serial</text>
        <rect x="698" y="238" width="86" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="741" y="262" text-anchor="middle">Web</text>
        <rect x="794" y="238" width="142" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="865" y="262" text-anchor="middle">Containers</text>
        <rect x="946" y="238" width="136" height="36" rx="18" fill="#1a2547" stroke="#33478a"/><text x="1014" y="262" text-anchor="middle">Proxmox</text>
      </g>
    </g>

    <!-- terminal line with blinking cursor -->
    <g font-family="'IBM Plex Mono', Consolas, Menlo, monospace" font-size="19">
      <text x="420" y="324" fill="#6cc9a5">ops@aurora</text>
      <text x="540" y="324" fill="#8fa0c8">:~$</text>
      <text x="584" y="324" fill="#e8eeff">ssh fw-kunde-a</text>
      <rect x="722" y="308" width="11" height="20" fill="#7de3bd">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="22" fill="none" stroke="#2a3766"/>
</svg>
