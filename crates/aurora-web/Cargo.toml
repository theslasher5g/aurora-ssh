[package]
name = "aurora-web"
version = "0.1.0"
edition = "2024"
description = "Web-Hilfsprozess für Aurora (wry/tao): öffnet Weboberflächen von Firewalls, NAS, Proxmox … mit eigenem Profil"

# Eigenständiges Paket (wie aurora-rdp): eigene Abhängigkeiten, eigenes Cargo.lock.
[workspace]

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
# Same versions wry uses: focus handling of the embedded (X11 child) window.
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2"

[target.'cfg(windows)'.dependencies]
# Same versions wry uses: certificate error hook of WebView2 (pinning).
webview2-com = "0.39"
windows = "0.62"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
codegen-units = 1
panic = "abort"
