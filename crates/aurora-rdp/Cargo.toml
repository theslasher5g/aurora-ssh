[package]
name = "aurora-rdp"
version = "0.1.0"
edition = "2024"
description = "RDP-Hilfsprozess für Aurora (IronRDP), streamt Bildbereiche über stdio"

# Eigenständiges Paket: IronRDP pinnt Krypto-Vorabversionen, die mit russh im Haupt-Crate kollidieren.
[workspace]

[dependencies]
ironrdp = { version = "0.17", features = ["client", "client-clipboard", "rustls", "cliprdr", "rdpdr", "rdpsnd", "input", "pdu", "core", "svc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Local fixes: padded RDP6/RLE bitmaps, unknown IO PDUs (see vendor/*/AURORA PATCH).
[patch.crates-io]
ironrdp-session = { path = "vendor/ironrdp-session" }
# TLS server key pinning hook (ironrdp-tls does not verify certificates).
ironrdp-client = { path = "vendor/ironrdp-client" }

[profile.release]
lto = "thin"
strip = true
