# Builds Windows, Linux and macOS packages and publishes them together in ONE release.
#   tag v0.10.1 -> Windows installer + portable zip, .deb + portable tar.gz, SHA256SUMS.txt
# Either push the tag, or run the workflow manually (it then creates the tag itself).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v)
        default: "0.10.1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/aurora-rdp -> target
            crates/aurora-web -> target

      # aws-lc-sys (TLS/crypto) needs NASM on MSVC.
      - uses: ilammy/setup-nasm@v1

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path crates/aurora-rdp/Cargo.toml
          cargo build --release --locked --manifest-path crates/aurora-web/Cargo.toml

      # Code signing (optional): set the repository secrets WINDOWS_CERT_PFX (base64 of a
      # .pfx code-signing certificate) and WINDOWS_CERT_PASSWORD. Without them the build
      # stays unsigned and SmartScreen warns on first start. Signed: Aurora.exe,
      # aurora-rdp.exe, aurora-web.exe (inside the portable zip AND the installer) and the
      # installer itself. See packaging/WINDOWS-SIGNING.md (SignPath / Azure Trusted Signing).
      - name: Package
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:VERSION
          $sign = $false
          if ($env:CERT_PFX) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
            $sign = $true
          }
          # RFC 3161 timestamp (/tr + /td sha256) keeps the signature valid after the
          # certificate expires; a second timestamp server is tried if the first is down.
          $timestamps = @("http://timestamp.digicert.com", "http://timestamp.sectigo.com")
          function Sign($file) {
            if (-not $sign) { return }
            $ok = $false
            foreach ($ts in $timestamps) {
              & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD `
                /fd sha256 /tr $ts /td sha256 /d "Aurora" $file
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            }
            if (-not $ok) { throw "signtool failed for $file" }
            & $signtool.FullName verify /pa /q $file
            if ($LASTEXITCODE -ne 0) { throw "signature check failed for $file" }
          }
          New-Item -ItemType Directory -Force dist/Aurora | Out-Null
          Copy-Item target/release/aurora-term.exe dist/Aurora/Aurora.exe
          Copy-Item crates/aurora-rdp/target/release/aurora-rdp.exe dist/Aurora/
          Copy-Item crates/aurora-web/target/release/aurora-web.exe dist/Aurora/
          Sign dist/Aurora/Aurora.exe
          Sign dist/Aurora/aurora-rdp.exe
          Sign dist/Aurora/aurora-web.exe
          Copy-Item README.md, SECURITY.md dist/Aurora/
          Compress-Archive -Path dist/Aurora/* -DestinationPath "dist/Aurora-$version-windows-x64-portable.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DAppVersion=$version packaging/windows/aurora.iss
          Sign "dist/Aurora-$version-windows-x64-setup.exe"
          if ($sign) { Remove-Item "$env:RUNNER_TEMP\cert.pfx" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/aurora-rdp -> target
            crates/aurora-web -> target

      # The web helper (wry) needs the WebKitGTK and GTK headers; the .deb depends on
      # libwebkit2gtk-4.1-0 (available on Ubuntu 22.04+ and Debian 12+).
      - name: Web helper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config

      - name: Test
        run: |
          cargo test --release --locked
          cargo test --release --locked --manifest-path crates/aurora-web/Cargo.toml

      - name: Build
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path crates/aurora-rdp/Cargo.toml
          cargo build --release --locked --manifest-path crates/aurora-web/Cargo.toml

      - name: Package
        run: packaging/linux/build.sh "$VERSION" dist

      # Optional detached GPG signature of the .deb (secrets DEB_SIGNING_KEY = armored
      # private key, DEB_SIGNING_PASSPHRASE optional). Skipped without the key.
      - name: Sign .deb
        env:
          DEB_SIGNING_KEY: ${{ secrets.DEB_SIGNING_KEY }}
          DEB_SIGNING_PASSPHRASE: ${{ secrets.DEB_SIGNING_PASSPHRASE }}
        run: packaging/linux/sign-deb.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.asc

  macos:
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/aurora-rdp -> target
            crates/aurora-web -> target

      - name: Test
        run: cargo test --release --locked

      - name: Build (Apple Silicon + Intel)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target $t
            cargo build --release --locked --target $t --manifest-path crates/aurora-rdp/Cargo.toml
            cargo build --release --locked --target $t --manifest-path crates/aurora-web/Cargo.toml
          done

      # Optional Developer ID signing + notarization; every secret is optional, without
      # them the app is ad-hoc signed as before. See packaging/macos/SIGNING.md.
      - name: Package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: packaging/macos/build.sh "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  publish:
    # macOS is a bonus: a failing Mac build must not block Windows/Linux.
    needs: [version, windows, linux, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-22.04
    # id-token: write lets cosign sign keylessly with this workflow's OIDC identity.
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file for everything; the in-app updater verifies against it.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.exe *.zip *.deb *.tar.gz $(ls *.dmg 2>/dev/null) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Release signature (optional): with the secret RELEASE_SIGNING_KEY (Ed25519 private
      # key, PEM) SHA256SUMS.txt.sig is created; the app verifies it against the public key
      # compiled in (assets/release-signing-key.txt). See packaging/keys/README.md.
      - name: Sign checksums (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: packaging/scripts/sign-release.sh dist

      # Keyless Sigstore signature, no secret needed: proves SHA256SUMS.txt was produced
      # by THIS repository's workflow (certificate identity in the bundle). Extra proof for
      # people who verify with cosign; the app does not depend on it, so a Sigstore outage
      # must not block the release.
      - uses: sigstore/cosign-installer@v3.7.0
        continue-on-error: true
      - name: Sign checksums (cosign keyless)
        continue-on-error: true
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.txt.cosign.bundle dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Aurora ${{ env.VERSION }}
          make_latest: true
          body: |
            **Aurora ${{ env.VERSION }}** – Windows, Linux and macOS

            **New in 0.10.1:** review fixes - the multi-host run recognises more ways to hide dangerous commands (escaped quotes, `$(…)`, `bash -lc`, `timeout`, PowerShell short forms), secrets are masked before output is cut, only one multi-host run at a time, RDP drive sharing wildcard and path fixes, PBS prune preview and task errors, safer release workflow. 0.10.0 brought: web interfaces in the Aurora tab, multi-host commands, live host statistics, WinRM, Proxmox customers/PBS/cloud-init, RDP drive sharing, big inventories. Full list: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/CHANGELOG.md)

            | System | File | Install |
            |---|---|---|
            | Windows (x64) | `Aurora-${{ env.VERSION }}-windows-x64-setup.exe` | run the installer |
            | | `Aurora-${{ env.VERSION }}-windows-x64-portable.zip` | unzip, start `Aurora.exe` |
            | Linux (x86_64) | `aurora_${{ env.VERSION }}_amd64.deb` | `sudo apt install ./aurora_${{ env.VERSION }}_amd64.deb` |
            | | `aurora-${{ env.VERSION }}-linux-x86_64.tar.gz` | unpack, `./install.sh` (to `~/.local`) or `./aurora` |
            | macOS 11+ (Apple Silicon & Intel) | `Aurora-${{ env.VERSION }}-macos-universal.dmg` | open, drag Aurora to Applications |

            Aurora checks for new versions on start and can update itself (Settings → Updates; downloads are verified against `SHA256SUMS.txt`, and, once release signing is set up, its signature `SHA256SUMS.txt.sig`). Verify by hand: see [“Verify your download”](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#verify-your-download).

            **Windows:** without a code-signing certificate SmartScreen may ask on first start ("More info" → "Run anyway").
            **macOS:** the app is not notarized – on first start right-click Aurora → Open, or run `xattr -cr /Applications/Aurora.app`.
            **Linux:** needs glibc ≥ 2.35 and X11 or Wayland with OpenGL; web interface entries need WebKitGTK (`libwebkit2gtk-4.1-0`, installed with the .deb).
            **Windows:** web interface entries use the Microsoft Edge WebView2 runtime (part of Windows 11 and current Windows 10).

            The UI is available in English and German (Settings → Language).
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
            dist/SHA256SUMS.txt.cosign.bundle
            dist/*.asc
