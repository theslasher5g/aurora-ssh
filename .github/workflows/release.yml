# Builds Windows and Linux packages and publishes them together in ONE release.
#   tag v0.3.0 -> Windows installer + portable zip, .deb + portable tar.gz, SHA256SUMS.txt
# Either push the tag, or run the workflow manually (it then creates the tag itself).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version (ohne v)
        default: "0.3.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/aurora-rdp -> target

      # aws-lc-sys (TLS/crypto) needs NASM on MSVC.
      - uses: ilammy/setup-nasm@v1

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path crates/aurora-rdp/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Force dist/Aurora | Out-Null
          Copy-Item target/release/aurora-term.exe dist/Aurora/Aurora.exe
          Copy-Item crates/aurora-rdp/target/release/aurora-rdp.exe dist/Aurora/
          Copy-Item README.md, SECURITY.md dist/Aurora/
          Compress-Archive -Path dist/Aurora/* -DestinationPath "dist/Aurora-$version-windows-x64-portable.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DAppVersion=$version packaging/windows/aurora.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/aurora-rdp -> target

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path crates/aurora-rdp/Cargo.toml

      - name: Package
        run: packaging/linux/build.sh "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file for everything; the in-app updater verifies against it.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.exe *.zip *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Aurora ${{ env.VERSION }}
          make_latest: true
          body: |
            **Aurora ${{ env.VERSION }}** – Windows und Linux

            | System | Datei | Installation |
            |---|---|---|
            | Windows (x64) | `Aurora-${{ env.VERSION }}-windows-x64-setup.exe` | Installer ausführen |
            | | `Aurora-${{ env.VERSION }}-windows-x64-portable.zip` | entpacken, `Aurora.exe` starten |
            | Linux (x86_64) | `aurora_${{ env.VERSION }}_amd64.deb` | `sudo apt install ./aurora_${{ env.VERSION }}_amd64.deb` |
            | | `aurora-${{ env.VERSION }}-linux-x86_64.tar.gz` | entpacken, `./install.sh` (nach `~/.local`) oder `./aurora` |

            Ab dieser Version prüft Aurora beim Start auf neue Versionen und aktualisiert sich auf Wunsch selbst
            (Einstellungen → Updates; Download wird gegen `SHA256SUMS.txt` geprüft).

            Windows: nicht signiert – SmartScreen fragt beim ersten Start evtl. nach („Weitere Informationen" → „Trotzdem ausführen").
            Linux: benötigt glibc ≥ 2.35 sowie X11 oder Wayland mit OpenGL.
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
